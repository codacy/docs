extends: existence
message: "In general, don't hyphenate '%s'."
link: https://docs.microsoft.com/en-us/style-guide/a-z-word-list-term-collections/a/auto
ignorecase: true
level: error
action:
  name: convert
  params:
    - simple
tokens:
  - 'auto-\w+'
# "Auto-configure"/"Auto-configuration" is Codacy's own hyphenated feature and
# button name, verified against the shipped product UI — not a style choice
# this rule should flag.
exceptions:
  - Auto-configure
  - Auto-configuring
  - Auto-configuration
  - auto-configure
  - auto-configuring
  - auto-configuration
