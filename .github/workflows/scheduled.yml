name: Scheduled jobs

on:
  schedule:
   - cron: "15 5 * * 1"

jobs:
  check-broken-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for broken links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --accept '100..=103,200..=299,403' ./docs/**/*.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken link report
          content-filepath: ./lychee/out.md
          labels: report, automated issue

  check-supported-tools:
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILE: ${{ github.workspace }}/supported-tools-report.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Check supported tools
        run: |
          cd tools
          python ./check-supported-tools.py > ${{ env.OUTPUT_FILE }}

      - name: Create issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        if: ${{ failure() }}
        with:
          title: Missing supported tools report
          content-filepath: ${{ env.OUTPUT_FILE }}
          labels: report, automated issue

  check-security-tools:
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILE: ${{ github.workspace }}/security-tools-report.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Check tools that report security issues
        run: |
          cd tools
          python ./check-security-tools.py > ${{ env.OUTPUT_FILE }}

      - name: Create issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        if: ${{ failure() }}
        with:
          title: Missing security tools report
          content-filepath: ${{ env.OUTPUT_FILE }}
          labels: report, automated issue

  compress-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compress images
        id: calibre
        uses: calibreapp/image-actions@cfe6ba91a2f0e9046d44e2088d002378daeb4a9c # main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true

      - name: Create pull request
        if: steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "clean: Compress images"
          branch-suffix: timestamp
          commit-message: "clean: Compress images"
          body: ${{ steps.calibre.outputs.markdown }}
