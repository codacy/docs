# Verity — Standard
# Generated by /verity-setup. See STANDARDS-SPEC.md for the full schema.

version: "1.0.0"
created_by: "claudia@codacy.com"

knowledge_spec:
  project_name: "codacy/docs"
  languages: [python, javascript, css, shell, markdown]
  frameworks: [mkdocs, mkdocs-material, jinja2]
  architecture: "monolith"     # single MkDocs site; two git submodules (theme, chart) are vendored, not owned code
  build_system: "pip"
  test_framework: "none — correctness is enforced by mkdocs build --strict, htmltest, vale, and markdownlint rather than unit tests"

quality_dimensions:
  - id: comprehensibility
    description: "Code readable in one context load"
    signals:
      - metric: file_length
        threshold: 300
        unit: lines
        rationale: "AI context windows degrade on large files"
      - metric: cyclomatic_complexity
        threshold: 15
        unit: per_function
        rationale: "Complexity-aware feedback improves AI performance by 35.71%"
      - metric: function_length
        threshold: 50
        unit: lines
        rationale: "Short functions are easier for agents to modify safely"
      - metric: naming_quality
        tool: ai
        rationale: "Descriptive names improve AI comprehension by 2x"

  - id: modularity
    description: "Modify one concern without touching 3+ files"
    signals:
      - metric: single_responsibility
        tool: ai
        rationale: "AI performance drops sharply at 3+ files per change"
      - metric: shallow_abstractions
        tool: ai
        rationale: "LLMs struggle with deep inheritance hierarchies"

  - id: type_safety
    description: "Type system catches errors before runtime"
    signals:
      - metric: naming_and_docstring_clarity
        tool: ai
        languages: [python]
        rationale: "Project's Python surface (theme/hooks, tools/) is untyped; AI review substitutes for a type checker until annotations are adopted"

  - id: test_adequacy
    description: "Content and tooling changes are verifiable before merge"
    signals:
      - metric: build_validation
        tool: ai
        rationale: "No unit test suite exists; mkdocs build --strict, htmltest, vale, and markdownlint are the project's actual safety net and should be treated as the coverage signal"
      - metric: test_quality
        tool: ai
        rationale: "Any new Python/JS helper script should carry at least a smoke check; flag scripts with none"

security_patterns:
  - id: no-hardcoded-secrets
    description: "No secrets, API keys, passwords, or tokens in source code"
    severity: critical
    cwe: [CWE-798]
    enforced_by:
      - tool: Trivy
        config:
          scanners: [secret]

  - id: input-sanitization
    description: "All user input validated and sanitized before use"
    severity: critical
    cwe: [CWE-20, CWE-80, CWE-89, CWE-117]
    enforced_by: []  # AI-only — project has no user-facing request handling; applies mainly to theme/hooks/image_metadata.py and JS in docs/assets/javascripts

  - id: parameterized-queries
    description: "Database queries use parameters, never string concatenation"
    severity: critical
    cwe: [CWE-89]
    enforced_by: []  # not applicable — no database access in this codebase; kept per Standard schema

  - id: dependency-verification
    description: "No known-vulnerable dependencies"
    severity: high
    cwe: [CWE-1395]
    enforced_by:
      - tool: Trivy
        config:
          scanners: [vuln]
          severity: [HIGH, CRITICAL]

  - id: no-unsafe-deserialization
    description: "No unsafe deserialization of untrusted data"
    severity: high
    cwe: [CWE-502]
    enforced_by:
      - tool: Ruff
        rules: [S301]

  - id: access-control-checks
    description: "Authorization verified on all sensitive operations"
    severity: high
    cwe: [CWE-639]
    enforced_by: []  # AI-only — requires business context

  - id: config-file-integrity
    description: "Configuration files not manipulable by untrusted input"
    severity: high
    cwe: [CWE-15]
    enforced_by: []  # AI-only

custom_patterns:
  - id: nav-and-redirect-registration
    description: "A new page has a mkdocs.yml nav: entry; a renamed/deleted page has a redirect_maps entry"
    severity: high
    enforced_by: []  # AI-only — mkdocs build --strict does not catch either omission
    rationale: "docs/CLAUDE.md: missing nav is silent (page builds but is unreachable); missing redirect breaks inbound links. Both are info-level or unchecked by the strict build."

  - id: no-invented-specifics
    description: "Steps, UI labels, endpoints, filenames, and behaviors are confirmed against code/existing docs, or marked <!-- TODO: verify ... -->"
    severity: high
    enforced_by: []  # AI-only
    rationale: "docs/CLAUDE.md hard rule — an invented button label or endpoint is worse than an honest gap."

  - id: no-marketing-filler
    description: "Avoid marketing adjectives and filler ('powerful', 'seamless', 'robust', 'effortless', 'it's worth noting that', 'in order to', 'simply', 'just')"
    severity: medium
    enforced_by: []  # AI-only — voice/tone check
    rationale: "docs/CLAUDE.md hard rule and .claude/reference/voice.md — show the product working instead of grading it."

  - id: self-hosted-version-gating
    description: "A Self-hosted-specific claim states the version and is checked against extra.codacy_self_hosted_version in mkdocs.yml"
    severity: medium
    enforced_by: []  # AI-only
    rationale: "docs/CLAUDE.md — prevents presenting a version-gated behavior as universally current."

  - id: alt-text-and-icon-safety
    description: "Images carry alt text; a new top-level nav: section's sidebar_icons entry names an SVG that actually exists under theme/assets/vendor/ionicons/svg/"
    severity: high
    enforced_by: []  # AI-only
    rationale: "docs/CLAUDE.md — an invented icon name crashes the build with a Jinja TemplateNotFound, not a warning."

process_constraints:
  self_healing_limit: 2
  analysis_mode: balanced

  compound_enabled: true
  memory_graph_enabled: true
  memory_graph_budget_tokens: 2000
  knowledge_injection_budget_tokens: 2000
  finding_autosuppress_threshold: 2

  intent_fail_threshold: 4
  intent_warn_threshold: 7

  exclude_paths:
    - node_modules
    - dist
    - build
    - .git
    - vendor
    - __pycache__
    - .next
    - coverage
    - site
    - .venv
    - .cache
    - submodules
    - .claude/worktrees
    - .codacy

tool_configuration:
  eslint:
    enabled: true
    config_file: ".codacy/tools-configs/eslint.config.mjs"
  ruff:
    enabled: true
  shellcheck:
    enabled: true
  trivy:
    enabled: true
